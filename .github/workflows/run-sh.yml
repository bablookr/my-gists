name: Run Shell Script

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Shell script name (e.g. - hello_world)'
        required: true
      arguments:
        description: 'Arguments'
        required: false

run-name: ${{ github.event.inputs.filename }}.sh

env:
  INPUT_SCRIPT_NAME: ${{ github.event.inputs.filename }}
  ARGS: ${{ github.event.inputs.arguments }}

jobs:
  setup-and-run:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup
        run: brew install tree

      - name: Run
        run: |
          cd sh
          sh ${INPUT_FILE_NAME}.sh ${ARGS}
          tree -I venv
