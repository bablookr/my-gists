name: Run Python Workflow

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Python file name (e.g. - hello_world)'
        required: true

run-name: ${{ github.event.inputs.filename }}.py

env:
  INPUT_FILE_NAME: ${{ github.event.inputs.filename }}

jobs:
  setup-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.9' 

      - name: Install Dependencies
        run: |
          pip3 install numpy scipy pandas scikit-learn tensorflow torch transformers sentencepiece flask tabulate tf-keras
          pip3 list

      - name: Run
        run: python3 python/${INPUT_FILE_NAME}.py
